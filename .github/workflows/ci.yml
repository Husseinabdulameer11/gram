name: ci

on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - name: Test (ASan + UBSan)
        run: make test CC=${{ matrix.cc }}

  targets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install emulators and cross compilers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang llvm qemu-user \
            gcc-riscv64-linux-gnu gcc-arm-linux-gnueabihf \
            gcc-aarch64-linux-gnu gcc-s390x-linux-gnu \
            libc6-dev-riscv64-cross libc6-dev-armhf-cross \
            libc6-dev-arm64-cross libc6-dev-s390x-cross
      - name: Freestanding compile for 11 CPU targets
        run: make cross
      - name: Run the test suite under QEMU
        run: make qemu
      - name: Fuzz for one minute
        run: make fuzz FUZZ_TIME=60

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: make test

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: make mingw-w64-ucrt-x86_64-gcc
      - run: make test
